# AO4.Main.xex codegen hints for Title Update 1 (0.0.1.11). Used instead of ao4_main_functions.toml
# when title_update\ holds the update (CMakeLists.txt copies it to ao4_main_functions_active.toml). The update
# relinks AO4.Main, so every address of the base file was relocated to the patched image and
# checked (unique instruction-window match), new tail-branch targets and stubs added.

# AO4.Main.xex codegen hints.

# CRT setjmp/longjmp, redirected to the host's. Lua's protected calls depend on them
# (luaD_rawrunprotected / luaD_throw). Same addresses as the XenonRecomp build's AO4.toml.

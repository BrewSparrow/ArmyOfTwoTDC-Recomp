# Auto-generated cvar configuration
log_file = "logs/ui2.log"
window_width = 1280
window_height = 720
fullscreen = false
video_mode_width = 1920
video_mode_height = 1080
mnk_mode = true
mnk_mouse = true
keybind_a = "Space,Return"
keybind_b = "Backspace,F"
keybind_x = "R,E"
keybind_y = "Q"
keybind_left_trigger = "RMB"
keybind_right_trigger = "LMB"
keybind_left_shoulder = "G"
keybind_right_shoulder = "V"
keybind_lstick_press = "Shift"
keybind_rstick_up = "Numpad8"
keybind_rstick_down = "Numpad2"
keybind_rstick_left = "Numpad4"
keybind_rstick_right = "Numpad6"
keybind_rstick_press = "MMB,C"
keybind_dpad_up = "1,Up"
keybind_dpad_down = "2,Down"
keybind_dpad_left = "3,Left"
keybind_dpad_right = "4,Right"
keybind_back = "Tab"
keybind_start = "Escape"
gpu_plugin = "xenos"
readback_resolve = "fast"
readback_memexport_fast = false
readback_resolve_formats = "38"
ao2dc_dump_frame_at = 0
render_target_path_d3d12 = "rov"

# The game's screen-space ambient occlusion renders as flickering horizontal stripes under
# emulation; true replaces it with "no occlusion" (see HANDOFF "ReXGlue port").
ao2dc_disable_ssao = true

# Audio frames buffered ahead of the device (4-64; 256 samples each). 8 underran during heavy
# moments (grenades) and clicked; 16 is ~85 ms.
audio_maxqframes = 16

# Frame rate for the game's frame pacer: 30 (the original) or 60 (experimental).
ao2dc_frame_rate = 60
